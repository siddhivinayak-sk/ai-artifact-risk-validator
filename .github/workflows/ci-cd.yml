name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ── Type-check ──────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,test]"

      - name: Run mypy (strict)
        run: mypy src/ --strict

  # ── Tests (multi-version matrix) ───────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ]; then
            pytest tests/integration \
              -m integration \
              --cov \
              --cov-report=term-missing \
              --cov-append
          else
            echo "No integration tests directory found, skipping."
          fi

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Security audit ──────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install .

      - name: Run pip-audit
        run: |
          # Generate a frozen requirements list excluding the local package
          pip freeze --exclude ai-artifact-risk-validator > _audit_requirements.txt
          pip-audit --requirement _audit_requirements.txt --strict --desc

  # ── Publish (tagged releases only) ─────────────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package
        run: |
          pip install dist/*.whl
          python -c "from ai_artifact_risk_validator import Validator; print('Import OK')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Uncomment below to publish to Nexus instead of (or in addition to) PyPI
      # - name: Publish to Nexus
      #   env:
      #     TWINE_REPOSITORY_URL: ${{ secrets.NEXUS_REPOSITORY_URL }}
      #     TWINE_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      #     TWINE_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      #   run: twine upload dist/*

  # ── Docker Build & Push ─────────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: siddhivinayaksk/ai-artifact-risk-validator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          network: host
