name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ── Type-check ──────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  # ── Security audit ──────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --desc # --strict

  # ── Unit tests (multi-version matrix) ──────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e ".[test]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/integration \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Integration tests ───────────────────────────────────────────────
  integration-test:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e ".[test]"

      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ]; then
            pytest tests/integration \
              -m integration \
              --cov \
              --cov-report=term-missing \
              --cov-append
          else
            echo "No integration tests directory found, skipping."
          fi

  # ── Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, test, integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package installation
        run: |
          pip install dist/*.whl
          python -c "from ai_artifact_risk_validator import Validator; print('Import OK')"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/


# ── Publish to PyPI ─────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/0') ||
      startsWith(github.ref, 'refs/tags/1') ||
      startsWith(github.ref, 'refs/tags/2') ||
      startsWith(github.ref, 'refs/tags/3') ||
      startsWith(github.ref, 'refs/tags/4') ||
      startsWith(github.ref, 'refs/tags/5') ||
      startsWith(github.ref, 'refs/tags/6') ||
      startsWith(github.ref, 'refs/tags/7') ||
      startsWith(github.ref, 'refs/tags/8') ||
      startsWith(github.ref, 'refs/tags/9')
    environment: pypi
    permissions:
      id-token: write          # needed for trusted publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Publish to Nexus ────────────────────────────────────────────────
  publish-nexus:
    name: Publish to Nexus
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/0') ||
      startsWith(github.ref, 'refs/tags/1') ||
      startsWith(github.ref, 'refs/tags/2') ||
      startsWith(github.ref, 'refs/tags/3') ||
      startsWith(github.ref, 'refs/tags/4') ||
      startsWith(github.ref, 'refs/tags/5') ||
      startsWith(github.ref, 'refs/tags/6') ||
      startsWith(github.ref, 'refs/tags/7') ||
      startsWith(github.ref, 'refs/tags/8') ||
      startsWith(github.ref, 'refs/tags/9')
    environment: nexus
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: pip install twine

      - name: Publish to Nexus
        env:
          TWINE_REPOSITORY_URL: ${{ secrets.NEXUS_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: twine upload dist/*
