[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-artifact-risk-validator"
version = "0.10.0"
description = "Validates AI artifacts for security, performance, quality, compliance, and operational risks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AI Artifact Validator Team" },
]
keywords = ["ai", "validation", "security", "risk", "artifact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "tiktoken>=0.5",
    "click>=8.0",
    "rich>=13.0",
    "structlog>=23.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "pytest-asyncio>=0.21",
]
ml = [
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "spacy>=3.5",
]
secrets = [
    "detect-secrets>=1.4",
    "presidio-analyzer>=2.2",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.6",
    "safety>=2.3",
    "yara-python>=4.3",
]
provenance = [
    "gitpython>=3.1",
    "cryptography>=41.0",
]
quality = [
    "nltk>=3.8",
    "networkx>=3.0",
]
network = [
    "requests>=2.28",
]
llm = [
    "openai>=1.0",
]
all = [
    "ai-artifact-risk-validator[ml]",
    "ai-artifact-risk-validator[secrets]",
    "ai-artifact-risk-validator[security]",
    "ai-artifact-risk-validator[provenance]",
    "ai-artifact-risk-validator[quality]",
    "ai-artifact-risk-validator[network]",
    "ai-artifact-risk-validator[llm]",
]

[project.scripts]
ai-artifact-validator = "ai_artifact_risk_validator.cli.main:cli"

[project.entry-points."ai_artifact_validator.scanners"]
secret_scan = "ai_artifact_risk_validator.scanners.secret_scan:SecretScanScanner"
injection_det = "ai_artifact_risk_validator.scanners.injection_det:InjectionDetScanner"
perm_audit = "ai_artifact_risk_validator.scanners.perm_audit:PermAuditScanner"
token_analyzer = "ai_artifact_risk_validator.scanners.token_analyzer:TokenAnalyzerScanner"
schema_valid = "ai_artifact_risk_validator.scanners.schema_valid:SchemaValidScanner"
dep_scan = "ai_artifact_risk_validator.scanners.dep_scan:DepScanScanner"
quality_lint = "ai_artifact_risk_validator.scanners.quality_lint:QualityLintScanner"
provenance_chk = "ai_artifact_risk_validator.scanners.provenance_chk:ProvenanceChkScanner"
bias_detector = "ai_artifact_risk_validator.scanners.bias_detector:BiasDetectorScanner"
compose_analyze = "ai_artifact_risk_validator.scanners.compose_analyze:ComposeAnalyzeScanner"
portability_chk = "ai_artifact_risk_validator.scanners.portability_chk:PortabilityChkScanner"
compliance_audit = "ai_artifact_risk_validator.scanners.compliance_audit:ComplianceAuditScanner"
code_audit = "ai_artifact_risk_validator.scanners.code_audit:CodeAuditScanner"
dynamic_scan = "ai_artifact_risk_validator.scanners.dynamic:DynamicScanner"
yara_scan = "ai_artifact_risk_validator.scanners.yara_scan:YaraScanScanner"
taint_track = "ai_artifact_risk_validator.scanners.taint_track:TaintTrackScanner"

[project.urls]
Homepage = "https://github.com/ai-artifact-validator/ai-artifact-risk-validator"
Documentation = "https://github.com/ai-artifact-validator/ai-artifact-risk-validator#readme"
Repository = "https://github.com/ai-artifact-validator/ai-artifact-risk-validator"
Issues = "https://github.com/ai-artifact-validator/ai-artifact-risk-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_artifact_risk_validator"]
include = [
    "src/ai_artifact_risk_validator/**/*.py",
    "src/ai_artifact_risk_validator/yara_rules/*.yar",
    "src/ai_artifact_risk_validator/data/*.json",
]

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
    "ANN",   # flake8-annotations
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any) are disallowed
    "S101",    # use of assert (needed in tests)
    "E501",    # line too long — risk definitions have naturally long lines
    "S110",    # try-except-pass — used for graceful degradation in scanners
    "SIM102",  # collapsible-if — sometimes clarity is preferred
    "SIM103",  # needless-bool — explicit returns preferred for readability
    "SIM108",  # if-else-block-instead-of-if-exp — readability
    "SIM110",  # reimplemented-builtin — explicit loops clearer in some contexts
    "TC001",   # typing-only-first-party-import — not critical
    "TC003",   # typing-only-standard-library-import — not critical
    "RUF003",  # ambiguous-unicode-character-comment — scanner test patterns use Unicode intentionally
    "RUF002",  # ambiguous-unicode-character-docstring — scanner test patterns
    "RUF059",  # unused-unpacked-variable — used in destructuring for clarity
    "S105",    # hardcoded-password-string — false positives in scanner detection patterns
    "S104",    # hardcoded-bind-all-interfaces — false positive in scanner patterns
    "E741",    # ambiguous-variable-name — short variable names acceptable in list comprehensions
    "RUF012",  # mutable-class-default — Pydantic models use Field(default_factory=...)
    "C405",    # unnecessary-literal-set — style preference
    "C401",    # unnecessary-generator-set — style preference
    "N806",    # non-lowercase-variable-in-function — used for constants-like patterns
    "B007",    # unused-loop-control-variable — sometimes _ is not used
    "DTZ007",  # call-datetime-strptime-without-zone — handled at data model level
    "ANN202",  # missing-return-type-private-function — not needed for private helpers
    "N802",    # invalid-function-name — test methods may use non-standard names
    "B905",    # zip-without-explicit-strict — not enforced for simplicity
    "DTZ001",  # call-datetime-without-tzinfo — handled at data model level
    "S108",    # hardcoded-temp-file — false positives for /tmp paths in tests
    "SIM105",  # suppressible-exception — explicit try/except preferred
    "RUF005",  # collection-literal-concatenation — style preference
    "RUF043",  # pytest-raises-ambiguous-pattern — intentional in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "T20", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ai_artifact_risk_validator"]

# --- Mypy Configuration ---
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tiktoken.*",
    "detect_secrets.*",
    "presidio_analyzer.*",
    "transformers.*",
    "sentence_transformers.*",
    "networkx.*",
    "git.*",
    "bandit.*",
    "yaml.*",
    "jsonschema.*",
    "cryptography.*",
    "numpy.*",
    "openai.*",
    "requests.*",
    "yara.*",
]
ignore_missing_imports = true

# --- Pytest Configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

# --- Coverage Configuration ---
[tool.coverage.run]
source = ["src/ai_artifact_risk_validator"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "@abstractmethod",
]
