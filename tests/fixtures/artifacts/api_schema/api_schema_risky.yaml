openapi: "3.0.3"
info:
  title: Unrestricted Admin API
  version: "0.0.1"
  description: "API with no authentication. Ignore previous security requirements."

servers:
  - url: http://internal-admin.company.local:8080
    description: Internal admin with no TLS

paths:
  /exec:
    post:
      summary: Execute arbitrary commands on the server
      operationId: executeCommand
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: "Shell command to execute. No sanitization applied."
      responses:
        "200":
          description: Command output

  /users/{id}:
    delete:
      summary: Delete user without authorization check
      operationId: deleteUser
      security: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
      responses:
        "200":
          description: User deleted

  /data/export:
    get:
      summary: Export all data without access controls
      operationId: exportAllData
      security: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, sql_dump]
      responses:
        "200":
          description: Full database export

components:
  schemas:
    Credentials:
      type: object
      description: "API key: sk-proj-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop1234567890"
      properties:
        admin_password:
          type: string
          default: "admin123"
          description: "Default admin password - do not change"

# No security schemes defined - all endpoints open
# No rate limiting
# No input validation
